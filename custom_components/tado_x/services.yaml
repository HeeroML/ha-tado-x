set_climate_timer:
  target:
    entity:
      integration: tado_x
      domain: climate
  fields:
    temperature:
      required: true
      example: 21.5
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    duration:
      example: 60
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
    termination:
      selector:
        select:
          options:
            - manual
            - next_time_block
            - timer
          translation_key: termination

get_schedule:
  target:
    entity:
      integration: tado_x
      domain: climate

set_schedule:
  target:
    entity:
      integration: tado_x
      domain: climate
  fields:
    days:
      required: true
      example: '["monday", "tuesday"]'
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
          translation_key: weekday
    blocks:
      required: true
      example: '[{"start": "00:00", "end": "06:30", "temperature": 17}, {"start": "06:30", "end": "22:00", "temperature": 21}, {"start": "22:00", "end": "24:00", "power": "off"}]'
      selector:
        object:
          multiple: true
          translation_key: schedule_block
          label_field: start
          fields:
            start:
              required: true
              selector:
                text:
            end:
              required: true
              selector:
                text:
            power:
              selector:
                select:
                  options:
                    - "on"
                    - "off"
                  translation_key: power
            temperature:
              selector:
                number:
                  min: 5
                  max: 30
                  step: 0.5
                  unit_of_measurement: "°C"

get_day_report:
  target:
    entity:
      integration: tado_x
      domain: climate
  fields:
    date:
      selector:
        date:

set_temperature_offset:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: tado_x
              model: Radiator Valve X
            - integration: tado_x
              model: Temperature Sensor X
            - integration: tado_x
              model: Smart Thermostat X
    offset:
      required: true
      example: -1.5
      selector:
        number:
          min: -9.9
          max: 9.9
          step: 0.1
          unit_of_measurement: "°C"

add_meter_reading:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: tado_x
    reading:
      required: true
      example: 12345
      selector:
        number:
          min: 0
          max: 999999999
          mode: box
    date:
      selector:
        date:

set_eiq_tariff:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: tado_x
    tariff:
      required: true
      example: 0.85
      selector:
        number:
          min: 0
          max: 100
          step: 0.01
          mode: box
    unit:
      required: true
      selector:
        select:
          options:
            - m3
            - kwh
          translation_key: tariff_unit
    start_date:
      selector:
        date:
    end_date:
      selector:
        date:

get_holiday_mode:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: tado_x

set_holiday_mode:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: tado_x
    enabled:
      required: true
      selector:
        boolean:
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
